  # 채용 형태 분류 규칙
  jobtype_rules:
    정규:
      - 정규직
      - 공채
      - 일반직
      - 전임
    임기제:
      - 임기제
      - 지방기록연구사
      - 국가기록연구사
      - 전문경력관
      - 개방형
    계약:
      - 계약직
      - 기간제
      - 무기계약
      - 공무직
      - 대체인력
      - 육아휴직대체
    인턴:
      - 인턴
      - 청년인턴
      - 체험형

  # 자격 요건 태깅 규칙
  credential_rules:
    specialist_required: # 기록물관리전문요원 필수
      - 기록물관리전문요원
      - 전문요원
      - 기록물관리 전문요원
      - 기록관리학 석사

  closure:
    result_keywords:
      - 서류전형 합격자
      - 1차 합격자
      - 최종 합격자
      - 면접전형 결과
      - 채용결과
      - 전형결과
      - 합격자 공고
    safety_expire_days: 25

sources:
  - id: karma-notice
    name: 사단법인 한국기록전문가협회(KARMA)
    type: hub_board
    category: 협회·전문커뮤니티
    url: https://www.archivists.or.kr/category/NOTICE/%EC%B1%84%EC%9A%A9%EA%B3%B5%EA%B3%A0
    engine: httpx
    enabled: true

  - id: alio-records
    name: 잡알리오 공공기관 채용정보
    type: public_api_or_search
    category: 공공기관·공기업
    url: https://job.alio.go.kr/recruit.do
    keywords:
      - 기록물
      - 기록연구
      - 아키비스트
      - 기록관리
    engine: httpx
    enabled: true

  - id: gojobs-records
    name: 인사혁신처 나라일터
    type: public_api_or_search
    category: 지자체·국가기관(기록연구사)
