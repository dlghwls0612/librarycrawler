# =====================================================================
# 서울·경기 도서관 채용 크롤러 — 소스 설정
# 기준일 2026-09-04 · 파서는 코드가 아니라 이 파일의 데이터로 관리
# region: 서울 | 경기 | 사서교사   (교육청 공공도서관은 지역에 편입 + 이름에 "(교육청)")
# parser: egov | gnuboard | sen | asp | incruit | saramin | fairyhr | spa | custom
# engine: httpx (가벼움) | playwright (봇우회·SPA·JS)
# =====================================================================

meta:
  project: 서울·경기 도서관 채용 크롤러
  version: 0.1
  source_date: "2026-09-04"

settings:
  # 도서관 공고 판별 키워드 (혼합 게시판에서 필터). 전용 채용게시판은 전부 수집 후 2차 선별.
  keywords_include: [사서, 도서관, 개관연장, "개관시간 연장", 순회사서, 자료실, 열람실, 작은도서관, 북큐레이터, 독서지도, 정보봉사, 상호대차, 이동도서관]
  # 제목 키워드 → 고용형태 태깅
  jobtype_rules:
    정규: [공무원, 정규직, 공개채용, 일반직, 임기제, 공채, "8급", "7급", "9급"]
    계약: [기간제, 계약직, 대체, 육아휴직, 휴직대체, 대체인력]
    알바: [단시간, 초단시간, 주말, 시간선택제, 아르바이트, 보조인력, 지원인력, 야간]
  # 마감(종료) 판정
  closure:
    safety_expire_days: 25            # ④ 안전만료(20~30 권장)
    result_keywords: [합격자, "서류전형 합격", "면접 대상", "최종 합격", "합격자 발표", "전형 결과", "채용 결과", 채용완료, "채용 완료", 채용마감, "채용 마감", 선정결과, 선발결과, "최종 결과", "[마감]", 모집마감, 채용연기, "채용 연기", 채용취소, "채용 취소"]  # ② 결과공고·마감·연기·취소 매칭(접수마감=마감일라벨 오탐 위험이라 제외)
  # 예의 크롤링
  request:
    delay_seconds: 2
    timeout_seconds: 20
    retries: 2
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36 (library-jobs-crawler; respectful)"

# 파서 유형별 기본 선택자 — 2단계에서 사이트별 검증하며 정밀 튜닝(placeholder)
parsers:
  egov:      { engine: httpx,       list_row: "table.board-list tbody tr, .bbs_list tbody tr", title_link: "td.subject a, td.title a, td.p-subject a", date: "td.date, td.reg-date", detail_deadline: "접수기간|접수마감|마감일|~" }
  gnuboard:  { engine: httpx,       list_row: "table.board_list tbody tr, .tbl_wrap tbody tr", title_link: "td.td_subject a, .bo_tit a", date: ".td_date, .date", detail_deadline: "접수기간|마감" }
  sen:       { engine: httpx,       list_row: ".board-list tbody tr, table tbody tr", title_link: "td.subject a, a.subject", date: "td.date", detail_deadline: "접수기간|마감" }
  asp:       { engine: httpx,       list_row: "table tbody tr", title_link: "td a", date: "td", detail_deadline: "접수기간|마감" }
  incruit:   { engine: httpx,       list_row: ".jobList li, .list_job li", title_link: "a", date: ".date, .period", detail_deadline: "마감|접수" }
  saramin:   { engine: playwright,  list_row: ".item_recruit", title_link: ".job_tit a", date: ".job_date .date", detail_deadline: "마감|접수" }
  fairyhr:   { engine: playwright,  list_row: ".list li, table tbody tr", title_link: "a", date: ".date", detail_deadline: "마감|접수" }
  spa:       { engine: playwright,  list_row: "TODO", title_link: "TODO", date: "TODO", detail_deadline: "접수기간|마감" }
  custom:    { engine: playwright,  list_row: "TODO", title_link: "TODO", date: "TODO", detail_deadline: "접수기간|마감" }

# =====================================================================
