<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg-lib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7C6B"/>
      <stop offset="100%" stop-color="#07483E"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg-lib)"/>
  <!-- Open Book Motif -->
  <!-- Left page -->
  <polygon points="48,30 25,27 20,30 20,70 25,67 48,71" fill="#F8FAFC"/>
  <!-- Right page -->
  <polygon points="52,30 75,27 80,30 80,70 75,67 52,71" fill="#F8FAFC"/>
  <!-- Spine shadow -->
  <line x1="50" y1="28" x2="50" y2="73" stroke="#07483E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lines -->
  <line x1="26" y1="41" x2="42" y2="39" stroke="#CFD9D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="49" x2="42" y2="47" stroke="#CFD9D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="57" x2="38" y2="55" stroke="#CFD9D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="39" x2="74" y2="41" stroke="#CFD9D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="47" x2="74" y2="49" stroke="#CFD9D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="55" x2="74" y2="57" stroke="#CFD9D5" stroke-width="2" stroke-linecap="round"/>
  <!-- Bookmark ribbon -->
  <polygon points="48,22 52,22 52,40 50,37 48,40" fill="#F0766B"/>
</svg>
