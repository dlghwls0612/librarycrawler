{"region":"경기","district":"과천시","source":"과천시 정보과학도서관","title":"2026년 하반기 과천시정보과학도서관 기간제근로자 채용 공고","jobType":"계약","posted":null,"deadline":null,"url":"https://www.gclib.go.kr/lib/menu/10099/bbs/20001/bbsPostList.do?manageCd=ALL&searchCondition=title&searchKeyword=%EC%B1%84%EC%9A%A9"}
]};

var JOBS = [], META = {};
var JOBLABEL = {정규:"정규", 계약:"계약", 알바:"알바"};
var NEW_DAYS = 14, SAFE_DAYS = 25;
var state = {region:"서울", district:"전체", q:"", sort:"new"};

function todayMs(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function ms(s){if(!s)return null;var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getTime();}
function isNew(j){return j.isNew===true;}  // 직전 수집 대비 '당일 신규'만
function isExpired(j){var t=ms(j.deadline);if(t!==null)return t<todayMs();var p=ms(j.posted);if(p!==null)return (todayMs()-p)>SAFE_DAYS*864e5;return false;}
function daysLeft(j){var t=ms(j.deadline);if(t===null)return null;return Math.round((t-todayMs())/864e5);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(s){if(!s)return null;var p=s.split("-");return p[1]+"."+p[2];}

var grid=document.getElementById("list"),empty=document.getElementById("empty"),chips=document.getElementById("districtChips");
var resultLine=document.getElementById("resultLine"),qIn=document.getElementById("q"),sortSel=document.getElementById("sort");

function open(){return JOBS.filter(function(j){return !isExpired(j);});}
function districts(region){var o=[];open().forEach(function(j){if(j.region===region&&o.indexOf(j.district)<0)o.push(j.district);});
  o.sort(function(a,b){if(a==="전역·통합")return 1;if(b==="전역·통합")return -1;return a.localeCompare(b,"ko");});return o;}
function matches(j){
  if(isExpired(j))return false;
  if(j.region!==state.region)return false;
  if(state.district!=="전체"&&j.district!==state.district)return false;
  if(state.q){var h=(j.title+" "+j.source+" "+j.district).toLowerCase();if(h.indexOf(state.q.toLowerCase())<0)return false;}
  return true;
}
function regionDots(){document.querySelectorAll("#regionSeg button").forEach(function(b){
  var reg=b.getAttribute("data-region");var has=open().some(function(j){return j.region===reg&&isNew(j);});
  b.querySelector(".ndot").hidden=!has;});}
function renderChips(){
  chips.innerHTML="";
  ["전체"].concat(districts(state.region)).forEach(function(d){
    var b=document.createElement("button");b.className="chip";b.type="button";
    b.setAttribute("aria-pressed",state.district===d?"true":"false");
    var hasNew=d!=="전체"&&open().some(function(j){return j.region===state.region&&j.district===d&&isNew(j);});
    b.innerHTML=esc(d==="전역·통합"?(state.region+" 전역"):d)+(hasNew?'<span class="ndot"></span>':'');
    b.addEventListener("click",function(){state.district=d;renderChips();render();});
    chips.appendChild(b);
  });
}
function render(){
  var items=JOBS.filter(matches);
  items.sort(function(a,b){if(state.sort==="deadline"){var da=ms(a.deadline)||8e15,db=ms(b.deadline)||8e15;return da-db;}return (ms(b.posted)||0)-(ms(a.posted)||0);});
  grid.innerHTML="";
  empty.hidden=items.length>0;
  if(!items.length)empty.textContent=state.region==="사서교사"?"현재 열린 사서교사 공고가 없어요. (전체 자동수집 가동 시 표시)":"조건에 맞는 공고가 없어요. 시·구를 바꿔보세요.";
  resultLine.textContent=state.region+" · "+(state.district==="전체"?"전체":(state.district==="전역·통합"?"전역":state.district))+" · "+items.length+"건";
  items.forEach(function(j){
    var el=document.createElement("article");el.className="job";
    var dl=daysLeft(j);var dlTxt=dl===null?"":(dl===0?"오늘 마감":(dl>0?"D-"+dl:""));
    var datePart=(j.posted?("게시 "+fmt(j.posted)+" · "):"")+"마감 "+(j.deadline?fmt(j.deadline):"공고문 확인")+(dlTxt?' <span class="dl">'+dlTxt+"</span>":"");
    el.innerHTML=
      '<div class="job-top"><h3>'+esc(j.title)+'</h3>'+(isNew(j)?'<span class="badge-new">NEW</span>':'')+'</div>'+
      '<div class="job-meta"><span class="src">'+esc(j.source)+'</span><span class="dot-sep">·</span><span class="dist">'+esc(j.district==="전역·통합"?(j.region+" 전역"):j.district)+'</span><span class="jt '+j.jobType+'">'+esc(JOBLABEL[j.jobType]||j.jobType)+'</span></div>'+
      '<div class="job-foot"><span class="dates">'+datePart+'</span>'+
      '<a class="cta" href="'+esc(j.url)+'" target="_blank" rel="noopener">원문 보기<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 17 17 7M9 7h8v8"/></svg></a></div>';
    grid.appendChild(el);
  });
}
function renderCounts(){
  var o=open();
  document.getElementById("counts").innerHTML="현재 열린 공고 <b>"+o.length+"</b>건 · 오늘 새로 <b style='color:var(--new)'>"+o.filter(isNew).length+"</b>건 <span style='color:var(--faint)'>· "+(META.collected_at||"")+" 수집</span>";
  document.getElementById("disc").innerHTML="수집 기준 "+esc(META.collected_at||"")+" · 마감된 공고는 자동 숨김 · 빨간 NEW·점=직전 수집 이후 새로 올라온 공고 · '원문 보기'는 실제 공고/게시판으로 연결."+(META.note?("<br>· "+esc(META.note)):"");
}
document.querySelectorAll("#regionSeg button").forEach(function(btn){
  btn.addEventListener("click",function(){
    state.region=btn.getAttribute("data-region");state.district="전체";
    document.querySelectorAll("#regionSeg button").forEach(function(b){b.setAttribute("aria-pressed",b===btn?"true":"false");});
    renderChips();render();});});
qIn.addEventListener("input",function(){state.q=qIn.value.trim();render();});
sortSel.addEventListener("change",function(){state.sort=sortSel.value;render();});

function boot(data){JOBS=data.jobs||[];META=data.meta||{};renderCounts();regionDots();renderChips();render();}
fetch("data/jobs.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(boot).catch(function(){boot(EMBEDDED);});
</script>
</body>
</html>
